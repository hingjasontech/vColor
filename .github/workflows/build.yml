name: Build desktop bundles

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows-x64
          - os: ubuntu-latest
            slug: linux-x86_64
          # macos-latest is arm64 (macOS 26); macos-14 was retired in Nov 2026.
          - os: macos-latest
            slug: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            rpm

      - name: Sync dependencies
        run: uv sync --locked

      - name: Test and build
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python scripts/build.py

      - name: Package archive
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python scripts/package.py

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: vColor-${{ matrix.slug }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate checksums
        run: |
          cd release-assets
          find . -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.dmg' \) -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            | sed 's|  \./[^/]*/|  |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: vColor ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.dmg
            release-assets/SHA256SUMS.txt
