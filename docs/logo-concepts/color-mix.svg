<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">vColor concept: Color Mix</title>
  <desc id="desc">Three overlapping cyan, magenta, and yellow circles mixing on a light rounded tile.</desc>
  <rect width="512" height="512" rx="112" fill="#F7F8FA"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#0F131C" stroke-opacity="0.08"/>
  <g style="isolation:isolate">
    <circle cx="204" cy="188" r="112" fill="#00C8D7" style="mix-blend-mode:multiply"/>
    <circle cx="308" cy="188" r="112" fill="#F0388C" style="mix-blend-mode:multiply"/>
    <circle cx="256" cy="300" r="112" fill="#FFD23F" style="mix-blend-mode:multiply"/>
  </g>
</svg>
