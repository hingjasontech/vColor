<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">vColor concept: Swatch V</title>
  <desc id="desc">A lowercase v built from a blue-to-coral color gradient on a dark rounded tile.</desc>
  <defs>
    <linearGradient id="v-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#FF5C8A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0F131C"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <path d="M170 158 L256 354 L362 158" fill="none" stroke="url(#v-gradient)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
