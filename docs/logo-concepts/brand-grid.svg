<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">vColor concept: Brand Grid</title>
  <desc id="desc">Four rounded swatch tiles in shades of the #467DEA brand color, arranged in a tilted two-by-two grid on a dark rounded tile.</desc>
  <rect width="512" height="512" rx="112" fill="#0F131C"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <g transform="rotate(-8 256 256)">
    <rect x="118" y="118" width="126" height="126" rx="34" fill="#E3ECFC"/>
    <rect x="268" y="118" width="126" height="126" rx="34" fill="#ACC4F6"/>
    <rect x="118" y="268" width="126" height="126" rx="34" fill="#74A0EF"/>
    <rect x="268" y="268" width="126" height="126" rx="34" fill="#467DEA"/>
  </g>
</svg>
